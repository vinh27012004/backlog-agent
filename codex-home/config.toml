# Cấu hình Codex CLI dành riêng cho đội (đặt CODEX_HOME trỏ vào thư mục này).
# Kiểm cú pháp:  CODEX_HOME=codex-home codex --strict-config features list
# Đã kiểm với codex-cli 0.162.1. Đổi phiên bản thì kiểm lại.

# Model: để trống thì Codex dùng mặc định. Orchestrator truyền -m theo vai trò
# (xem config/agents.toml), nên ở đây không chốt.

approval_policy = "never"          # không có người trong trận, không hỏi duyệt
sandbox_mode = "workspace-write"   # vai trò read-only được orchestrator ghi đè bằng -s

[sandbox_workspace_write]
network_access = false             # lệnh Codex tự chạy không ra mạng

[shell_environment_policy]
inherit = "core"                   # không truyền biến môi trường (API key...) vào lệnh shell
exclude = ["*KEY*", "*TOKEN*", "*SECRET*"]

# Tắt các tính năng có thể ra mạng hoặc vượt ngoài phạm vi sửa code.
# Tra web đi qua MCP tool web_search của đội.
[features]
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
image_generation = false
apps = false
plugins = false
remote_plugin = false
skill_mcp_dependency_install = false
tool_suggest = false
multi_agent = false                # song song do orchestrator điều phối
memories = false
realtime_conversation = false

# MCP server của đội. Bật từng cái khi đã dựng xong (enabled = true).
[mcp_servers.codegraph]
command = "python"
args = ["-m", "tools.codegraph_server"]
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.runner]               # build · test · MVS · gọi app chạy sẵn
command = "python"
args = ["-m", "tools.runner_server"]
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 600

[mcp_servers.web]                  # web_search: tra web tự do, chặn Game Master/Admin/Grader
command = "python"
args = ["-m", "tools.web_server"]
enabled = false
startup_timeout_sec = 20
tool_timeout_sec = 60
