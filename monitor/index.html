<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backlog Agent Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: bảng điều khiển trận đấu — chỉ số tổng → luồng trạng thái → danh sách item + chi tiết → Jev/agent + sự kiện */
:root {
  --bg: #EDF0F3;
  --panel: #FFFFFF;
  --panel-2: #F5F7F9;
  --line: #D8DEE5;
  --ink: #131A23;
  --ink-2: #48525F;
  --ink-3: #7A8492;
  --accent: #2A56C0;
  --accent-soft: #E2E9F8;
  --ok: #1D8048; --ok-soft: #DFF2E6;
  --warn: #A86A10; --warn-soft: #FAEFD8;
  --crit: #C2302F; --crit-soft: #FAE3E2;
  --run: #2A56C0; --run-soft: #E2E9F8;
  --idle: #A3ACB8; --idle-soft: #EEF1F4;
  --t-bug: #C2410C; --t-cr: #1B6BB0; --t-sec: #7339D6; --t-issue: #5A6472;
  --shadow: 0 1px 2px rgba(19,26,35,.06);
  --f-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1319; --panel: #151C24; --panel-2: #1A222C; --line: #29333F;
    --ink: #E5EAF0; --ink-2: #A9B3C0; --ink-3: #788495;
    --accent: #7D9EF0; --accent-soft: #1D2943;
    --ok: #4CC07D; --ok-soft: #13301F; --warn: #E2A846; --warn-soft: #33270F;
    --crit: #EF7070; --crit-soft: #3A1A1B; --run: #7D9EF0; --run-soft: #1D2943;
    --idle: #5C6775; --idle-soft: #1E2630;
    --t-bug: #F08A4B; --t-cr: #5BA6E8; --t-sec: #A98BF5; --t-issue: #9AA4B1;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1319; --panel: #151C24; --panel-2: #1A222C; --line: #29333F;
  --ink: #E5EAF0; --ink-2: #A9B3C0; --ink-3: #788495;
  --accent: #7D9EF0; --accent-soft: #1D2943;
  --ok: #4CC07D; --ok-soft: #13301F; --warn: #E2A846; --warn-soft: #33270F;
  --crit: #EF7070; --crit-soft: #3A1A1B; --run: #7D9EF0; --run-soft: #1D2943;
  --idle: #5C6775; --idle-soft: #1E2630;
  --t-bug: #F08A4B; --t-cr: #5BA6E8; --t-sec: #A98BF5; --t-issue: #9AA4B1;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0 32px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.brand .sub { color: var(--ink-3); font-size: 13px; }
.sample {
  font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 4px;
}
.controls { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.clock { font-size: 13px; color: var(--ink-2); padding-right: 6px; }
.clock b { color: var(--ink); font-weight: 500; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: default; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.btn.running .live-dot { animation: pulse 1.2s ease-in-out infinite; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--panel); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.kpi .lbl { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.kpi .val { font-family: var(--f-mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .val small { font-size: 14px; color: var(--ink-3); font-weight: 400; }
.kpi .foot { font-size: 12px; color: var(--ink-2); }
.kpi .up { color: var(--ok); } .kpi .down { color: var(--crit); }
.kpi.alert .val { color: var(--crit); }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-h h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.panel-h .hint { color: var(--ink-3); font-size: 12px; }
.panel-h .right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

/* Flow */
.flow { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 12px; }
.stage-btn {
  flex: 1 0 118px; text-align: left; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; display: grid; gap: 2px; position: relative;
}
.stage-btn:hover { border-color: var(--ink-3); }
.stage-btn .n { font-family: var(--f-mono); font-size: 22px; font-weight: 500; line-height: 1.1; }
.stage-btn .s { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.stage-btn.active { background: var(--accent-soft); border-color: var(--accent); }
.stage-btn.active .s { color: var(--accent); }
.stage-btn.esc { background: var(--crit-soft); border-color: transparent; }
.stage-btn.esc .n, .stage-btn.esc .s { color: var(--crit); }
.stage-btn.esc.active { border-color: var(--crit); }
.arrow { flex: 0 0 22px; display: grid; place-items: center; color: var(--ink-3); font-size: 14px; }
.flow .sep { flex: 0 0 1px; background: var(--line); margin: 4px 12px; }

/* Main grid */
.main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.lower { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* Filters */
.fchip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2);
}
.fchip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* Table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
tbody tr.sel td { background: var(--accent-soft); }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr.flash td { animation: flash 1.4s ease-out; }
tbody tr:last-child td { border-bottom: 0; }
td.id { white-space: nowrap; }
td.id .mono { font-size: 12px; font-weight: 500; }
td.title { min-width: 220px; }
td.title .t { font-weight: 500; }
td.title .sub { font-size: 12px; color: var(--ink-3); }
td.num { text-align: right; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.empty-row td { text-align: center; color: var(--ink-3); padding: 28px; cursor: default; }

.type { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; margin-right: 6px; }
.type.BUG { color: var(--t-bug); } .type.CR { color: var(--t-cr); } .type.SEC { color: var(--t-sec); } .type.ISSUE { color: var(--t-issue); }
.prio { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.prio.P1 { color: var(--crit); font-weight: 500; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.backlog { color: var(--ink-3); background: var(--idle-soft); }
.pill.triage, .pill.agent, .pill.gate { color: var(--run); background: var(--run-soft); }
.pill.agent::before, .pill.gate::before, .pill.triage::before { animation: pulse 1.4s ease-in-out infinite; }
.pill.review { color: var(--warn); background: var(--warn-soft); }
.pill.done { color: var(--ok); background: var(--ok-soft); }
.pill.escalated { color: var(--crit); background: var(--crit-soft); }
.phase { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; padding-left: 2px; }

.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: var(--idle-soft); border: 1px solid var(--line); }
.pips i.on { background: var(--ink-2); border-color: var(--ink-2); }
.pips i.on.last { background: var(--warn); border-color: var(--warn); }
.pips.max i.on { background: var(--crit); border-color: var(--crit); }

.gate { display: inline-grid; grid-template-columns: repeat(8, 10px); gap: 3px; }
.gate i { width: 10px; height: 10px; border-radius: 2px; }
.g-pass { background: var(--ok); } .g-fail { background: var(--crit); } .g-warn { background: var(--warn); }
.g-run { background: var(--run); animation: pulse 1.2s ease-in-out infinite; }
.g-pending { background: var(--idle-soft); box-shadow: inset 0 0 0 1px var(--line); }
.g-skip { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* Detail */
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 90px); overflow: auto; }
.d-body { padding: 16px; display: grid; gap: 18px; }
.d-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.d-id .mono { font-size: 13px; font-weight: 500; }
.d-title { font-size: 17px; font-weight: 600; line-height: 1.35; margin-top: 6px; }
.d-stage { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.callout { border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.callout b { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 2px; }
.callout.crit { background: var(--crit-soft); color: var(--ink); } .callout.crit b { color: var(--crit); }
.callout.ok { background: var(--ok-soft); } .callout.ok b { color: var(--ok); }
.callout.info { background: var(--run-soft); } .callout.info b { color: var(--run); }

.meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.meta div { min-width: 0; }
.meta dt { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.meta dd { margin: 2px 0 0; font-size: 13px; overflow-wrap: anywhere; }
.meta .full { grid-column: 1 / -1; }
.bar { height: 6px; background: var(--idle-soft); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.hot i { background: var(--warn); }
.low { color: var(--crit); font-weight: 600; }

.sec-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.sec-h span { font-weight: 400; letter-spacing: 0; text-transform: none; }

.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; list-style: none; margin: 0; padding: 0; }
.checks li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; min-width: 0; }
.checks li .st { margin-left: auto; font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.checks li.fail .st { color: var(--crit); font-weight: 600; }
.checks li.warn .st { color: var(--warn); font-weight: 600; }
.checks li.run .st { color: var(--run); }
.checks i { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 10px; }

.trace { list-style: none; margin: 0; padding: 0; position: relative; }
.trace li { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); gap: 8px; padding-bottom: 10px; position: relative; }
.trace li::after { content: ""; position: absolute; left: 58px; top: 14px; bottom: -2px; width: 1px; background: var(--line); }
.trace li:last-child::after { display: none; }
.trace .tm { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); padding-top: 2px; }
.trace .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; justify-self: center; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--panel); }
.trace .dot.ok { background: var(--ok); } .trace .dot.fail { background: var(--crit); } .trace .dot.warn { background: var(--warn); }
.trace .dot.run { background: var(--run); animation: pulse 1.2s ease-in-out infinite; }
.trace .what { font-size: 13px; min-width: 0; }
.trace .what b { font-weight: 600; }
.tool { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.trace .msg { color: var(--ink-2); display: block; overflow-wrap: anywhere; }

.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.files li { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); background: var(--panel-2); border-radius: 4px; padding: 4px 8px; overflow-wrap: anywhere; }

.pr { display: grid; gap: 10px; margin: 0; }
.pr dt { font-size: 11px; color: var(--ink-3); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.pr dd { margin: 2px 0 0; font-size: 13px; }

.d-empty { padding: 48px 20px; text-align: center; color: var(--ink-3); }

/* Log */
.log { list-style: none; margin: 0; padding: 4px 0; max-height: 360px; overflow: auto; }
.log li { display: grid; grid-template-columns: 44px 8px 74px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 16px; font-size: 12.5px; }
.log li.new { animation: flash 1.4s ease-out; }
.log .tm { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.log .dt { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
.log .dt.ok { background: var(--ok); } .log .dt.fail { background: var(--crit); } .log .dt.warn { background: var(--warn); } .log .dt.run { background: var(--run); }
.log .tid { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.log .tid:hover { text-decoration: underline; }
.log .m { color: var(--ink-2); overflow-wrap: anywhere; }
.log .m b { color: var(--ink); font-weight: 600; }

.footnote { font-size: 12px; color: var(--ink-3); }
.footnote code { font-family: var(--f-mono); font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes flash { from { background: var(--warn-soft); } to { background: transparent; } }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .main, .lower { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; max-height: none; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .val { font-size: 22px; }
  .checks, .meta { grid-template-columns: minmax(0, 1fr); }
  .controls { margin-left: 0; }
  .log li { grid-template-columns: 40px 8px minmax(0, 1fr); }
  .log li .m { grid-column: 3; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; }
}

/* Mô hình trận đấu: 4 loại item, trạng thái item, deadline theo giờ server */
.type.TASK { color: var(--ink-2); } .type.PI { color: var(--crit); }
.pill.queued { color: var(--ink-3); background: var(--idle-soft); }
.pill.working { color: var(--run); background: var(--run-soft); }
.pill.working::before { animation: pulse 1.4s ease-in-out infinite; }
.pill.submitted { color: var(--ok); background: var(--ok-soft); }
.pill.dropped { color: var(--warn); background: var(--warn-soft); }
.pill.failed, .pill.unknown { color: var(--crit); background: var(--crit-soft); }
.gate { grid-template-columns: repeat(7, 10px); }
.left { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; }
.left.warm { color: var(--warn); font-weight: 500; } .left.hot { color: var(--crit); font-weight: 600; }
.sev { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.sev.critical, .sev.high { color: var(--crit); font-weight: 500; }
.callout.warn { background: var(--warn-soft); } .callout.warn b { color: var(--warn); }
.conn { font-size: 12px; color: var(--ink-3); }
.conn.err { color: var(--crit); font-weight: 500; }
.btn.paused .live-dot { animation: none; opacity: .4; }
pre.box { margin: 6px 0 0; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.45; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
.issues { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.stats-wrap { padding: 4px 0 8px; display: grid; gap: 10px; }
.stats-wrap h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 16px 0; }
.stats td, .stats th { padding: 6px 16px; }
.stats tbody tr { cursor: default; }
.stats tbody tr:hover td { background: transparent; }
.empty { padding: 16px; color: var(--ink-3); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1>Backlog Agent Monitor</h1>
      <span class="sub" id="match"></span>
      <span class="sample" id="sample-badge" hidden>Dữ liệu mẫu</span>
    </div>
    <div class="controls">
      <span class="clock">Trận <b class="mono" id="mstatus">—</b> · còn <b class="mono" id="mleft">—</b></span>
      <span class="conn" id="conn"></span>
      <button class="btn" id="btn-pause" type="button" hidden><span class="live-dot"></span><span id="pause-label">Tạm dừng cập nhật</span></button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Chỉ số tổng"></section>

  <section class="panel" aria-label="Luồng xử lý">
    <div class="panel-h">
      <h2>Luồng xử lý</h2>
      <span class="hint">Bấm một trạng thái để lọc danh sách</span>
    </div>
    <div class="flow" id="flow"></div>
  </section>

  <div class="main">
    <section class="panel" aria-label="Danh sách item">
      <div class="panel-h">
        <h2>Item</h2>
        <span class="hint" id="filter-hint"></span>
        <div class="right" id="type-filters"></div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Tiêu đề</th>
              <th>Trạng thái</th>
              <th style="text-align:right">Còn lại</th>
              <th>Lần thử</th>
              <th>Gate</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="panel detail" id="detail" aria-label="Chi tiết item"></aside>
  </div>

  <div class="lower">
    <section class="panel" aria-label="Jev và agent">
      <div class="panel-h">
        <h2>Jev và agent</h2>
        <span class="hint">Tỉ lệ Jev tự quyết (còn lại theo luật code) · thời gian chạy agent</span>
      </div>
      <div class="stats-wrap" id="stats"></div>
    </section>

    <section class="panel" aria-label="Sự kiện gần nhất">
      <div class="panel-h">
        <h2>Sự kiện gần nhất</h2>
        <span class="hint">Agent, gate, quyết định, nộp bài</span>
      </div>
      <ul class="log" id="log"></ul>
    </section>
  </div>

  <p class="footnote" id="footnote"></p>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  /* Nguồn dữ liệu: mở qua `python -m orchestrator.cli monitor` thì đọc /api/state mỗi 3 giây (SQLite của trận);
     mở index.html bằng file:// thì dùng window.MONITOR_DATA trong data.js (sinh từ một trận mock). */
  var LIVE = location.protocol === "http:" || location.protocol === "https:";
  var POLL_MS = 3000;

  var STATES = [
    { key: "queued", label: "Chờ" },
    { key: "working", label: "Đang làm" },
    { key: "submitted", label: "Đã nộp" }
  ];
  var SIDE = [{ key: "dropped", label: "Bỏ" }, { key: "failed", label: "Lỗi / chưa rõ" }];
  var STATE_LABEL = { queued: "Chờ", working: "Đang làm", submitted: "Đã nộp", dropped: "Bỏ", failed: "Lỗi", unknown: "Chưa rõ" };
  var GATE = [
    ["diff", "Kích thước diff"], ["forbidden", "Luật cấm"], ["build", "Build"], ["target_tests", "Test agent viết"],
    ["regression", "Regression"], ["mvs", "MVS"], ["reviewer", "Reviewer"]
  ];
  var GATE_ST = { pass: "Pass", fail: "Fail", warn: "Cảnh báo", run: "Đang chạy", pending: "Chưa chạy", skip: "Bỏ qua" };
  var TYPES = [["ALL", "Tất cả"], ["TASK", "TASK"], ["CR", "CR"], ["BUG", "BUG"], ["PI", "PI"]];
  var RANK = { working: 0, queued: 1, submitted: 2, dropped: 3, unknown: 4, failed: 4 };

  var data = null, ui = { state: null, type: "ALL", sel: null }, paused = false, seen = {};

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function find(id) { return data.items.filter(function (t) { return t.id === id; })[0]; }
  function hhmmss(ts) {
    if (!ts) return "--:--";
    var d = new Date(ts * 1000), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function mins(v) { return v == null ? "—" : (Math.round(v * 10) / 10) + "′"; }
  function stateKey(t) { return t.state === "unknown" ? "failed" : t.state; }

  /* ---------- Gate ---------- */
  function gateOf(t) {
    var g = {}, worst = { fail: 4, warn: 3, pass: 2, skip: 1, pending: 0 };
    GATE.forEach(function (k) { g[k[0]] = "pending"; });
    if (t.gate) t.gate.checks.forEach(function (c) {
      var key = c.name.split("[")[0], s = c.status === "skipped" ? "skip" : c.status;
      if (key === "tests_declared") key = "target_tests";
      if (!(key in g)) return;
      if (g[key] === "pending" || worst[s] > worst[g[key]]) g[key] = s;
    });
    if (t.review) g.reviewer = t.review.verdict === "approve" ? "pass" : "fail";
    else if (t.type === "PI") g.reviewer = "skip";
    if (t.state === "working" && t.phase && t.phase.indexOf("reviewer") === 0) g.reviewer = "run";
    return g;
  }
  function gateCells(t) {
    if (!t.gate) return '<span style="color:var(--ink-3);font-size:12px">—</span>';
    var g = gateOf(t);
    return '<span class="gate">' + GATE.map(function (k) {
      return '<i class="g-' + g[k[0]] + '" title="' + esc(k[1] + ": " + GATE_ST[g[k[0]]]) + '"></i>';
    }).join("") + "</span>";
  }

  /* ---------- KPI ---------- */
  function renderKpis() {
    var T = data.items, n = function (f) { return T.filter(f).length; };
    var sub = T.filter(function (t) { return t.state === "submitted"; });
    var score = sub.reduce(function (a, t) { return a + ((t.submission && t.submission.score) || 0); }, 0);
    var bad = n(function (t) { return t.state === "failed" || t.state === "unknown"; });
    var dropped = n(function (t) { return t.state === "dropped"; });
    var pis = T.filter(function (t) { return t.type === "PI"; });
    var tried = T.filter(function (t) { return t.attempts > 0; });
    var avgAtt = tried.length ? tried.reduce(function (a, t) { return a + t.attempts; }, 0) / tried.length : 0;
    var dec = (data.jev || []).reduce(function (a, r) { a.n += r.n; a.j += r.by_jev || 0; return a; }, { n: 0, j: 0 });
    var tiles = [
      { l: "Đã nộp", v: sub.length + '<small> / ' + T.length + '</small>', f: "Điểm tạm " + score },
      { l: "Đang làm", v: n(function (t) { return t.state === "working"; }), f: "Chờ: " + n(function (t) { return t.state === "queued"; }) },
      { l: "Bỏ / lỗi", v: dropped + bad, f: bad ? bad + " lỗi hoặc chưa rõ nộp" : "Không có lỗi", alert: bad > 0 },
      { l: "PI", v: pis.length, f: "Đã nộp " + pis.filter(function (t) { return t.state === "submitted"; }).length },
      { l: "Lần thử trung bình", v: avgAtt.toFixed(1) + '<small> / ' + data.meta.max_attempts + '</small>', f: "Trên " + tried.length + " item" },
      { l: "Jev tự quyết", v: (dec.n ? Math.round(dec.j / dec.n * 100) : 0) + '<small>%</small>', f: dec.n + " quyết định, còn lại theo luật code" }
    ];
    $("kpis").innerHTML = tiles.map(function (k) {
      return '<div class="kpi' + (k.alert ? " alert" : "") + '"><span class="lbl">' + k.l + '</span><span class="val">' + k.v + '</span><span class="foot">' + k.f + "</span></div>";
    }).join("");
  }

  /* ---------- Flow ---------- */
  function renderFlow() {
    var n = function (k) { return data.items.filter(function (t) { return stateKey(t) === k; }).length; };
    var btn = function (s, extra) {
      return '<button type="button" class="stage-btn' + (extra || "") + (ui.state === s.key ? " active" : "") + '" data-state="' + s.key + '" aria-pressed="' + (ui.state === s.key) + '">' +
        '<span class="n">' + n(s.key) + '</span><span class="s">' + s.label + "</span></button>";
    };
    var html = STATES.map(function (s, i) { return (i ? '<span class="arrow" aria-hidden="true">→</span>' : "") + btn(s); }).join("");
    html += '<span class="sep" aria-hidden="true"></span>' + btn(SIDE[0]) + '<span class="arrow" aria-hidden="true"></span>' + btn(SIDE[1], " esc");
    $("flow").innerHTML = html;
  }

  /* ---------- Table ---------- */
  function pips(t) {
    var max = data.meta.max_attempts, a = t.attempts || 0, out = "";
    for (var i = 1; i <= max; i++) out += '<i class="' + (i <= a ? "on" : "") + (i === a && a > 1 ? " last" : "") + '"></i>';
    return '<span class="pips' + (a >= max ? " max" : "") + '" title="' + a + "/" + max + ' lần thử">' + out + "</span>" +
      ' <span class="mono" style="font-size:12px;color:var(--ink-3)">' + a + "/" + max + "</span>";
  }
  function leftCell(t) {
    if (t.state === "submitted" || t.state === "dropped" || t.minutes_left == null) return '<span class="left" style="color:var(--ink-3)">—</span>';
    var cls = t.minutes_left < 5 ? " hot" : (t.minutes_left < 10 ? " warm" : "");
    return '<span class="left' + cls + '" title="Deadline ' + esc(t.deadline_min) + ' phút, theo giờ Game Master">' + mins(t.minutes_left) + "</span>";
  }
  function renderFilters() {
    $("type-filters").innerHTML = TYPES.map(function (x) {
      return '<button type="button" class="fchip' + (ui.type === x[0] ? " on" : "") + '" data-type="' + x[0] + '" aria-pressed="' + (ui.type === x[0]) + '">' + x[1] + "</button>";
    }).join("");
    $("filter-hint").textContent = ui.state ? "Đang lọc: " + STATE_LABEL[ui.state] : "";
  }
  function renderTable(flash) {
    var rows = data.items.filter(function (t) {
      return (!ui.state || stateKey(t) === ui.state) && (ui.type === "ALL" || t.type === ui.type);
    }).sort(function (a, b) {
      return RANK[a.state] - RANK[b.state] || (a.type === "PI" ? 0 : 1) - (b.type === "PI" ? 0 : 1) ||
        (a.minutes_left == null ? 1e9 : a.minutes_left) - (b.minutes_left == null ? 1e9 : b.minutes_left) || a.id.localeCompare(b.id);
    });
    if (!rows.length) {
      $("rows").innerHTML = '<tr class="empty-row"><td colspan="6">' + (data.items.length ? "Không có item nào khớp bộ lọc." : "Chưa có item nào.") + "</td></tr>";
      return;
    }
    $("rows").innerHTML = rows.map(function (t) {
      var sub = [t.tier ? "fixer " + t.tier : null, t.difficulty, t.injection ? "⚠ nghi bẫy prompt" : null].filter(Boolean).join(" · ");
      return '<tr data-id="' + esc(t.id) + '" tabindex="0" class="' + (ui.sel === t.id ? "sel" : "") + (flash[t.id] ? " flash" : "") + '">' +
        '<td class="id"><span class="type ' + esc(t.type) + '">' + esc(t.type) + '</span><span class="mono">' + esc(t.id) + '</span> <span class="sev ' + esc(t.severity) + '">' + esc(t.severity || "") + "</span></td>" +
        '<td class="title"><div class="t">' + esc(t.title) + '</div><div class="sub">' + esc(sub) + "</div></td>" +
        '<td><span class="pill ' + esc(t.state) + '">' + esc(STATE_LABEL[t.state] || t.state) + "</span>" + (t.phase ? '<span class="phase">' + esc(t.phase) + "</span>" : "") + "</td>" +
        '<td class="num">' + leftCell(t) + "</td>" +
        "<td>" + (t.attempts ? pips(t) : '<span style="color:var(--ink-3)">—</span>') + "</td>" +
        "<td>" + gateCells(t) + "</td></tr>";
    }).join("");
  }
  function renderLegend() {
    $("legend").innerHTML = '<span style="font-weight:600">Gate (7 ô theo thứ tự):</span> ' +
      GATE.map(function (k, i) { return (i + 1) + ". " + k[1]; }).join(" · ") +
      '<span style="flex-basis:100%;height:0"></span>' +
      ["pass", "fail", "warn", "run", "pending", "skip"].map(function (s) {
        return '<span><i class="g-' + s + '"></i>' + GATE_ST[s] + "</span>";
      }).join("");
  }

  /* ---------- Detail ---------- */
  function renderDetail() {
    var t = ui.sel && find(ui.sel);
    if (!t) { $("detail").innerHTML = '<div class="d-empty">Chọn một item để xem chi tiết.</div>'; return; }
    var h = [];
    h.push('<div class="panel-h"><h2>Chi tiết</h2></div><div class="d-body">');
    h.push('<div><div class="d-id"><span class="type ' + esc(t.type) + '">' + esc(t.type) + '</span><span class="mono">' + esc(t.id) + '</span><span class="sev ' + esc(t.severity) + '">' + esc(t.severity || "") + "</span></div>");
    h.push('<h3 class="d-title">' + esc(t.title) + "</h3>");
    h.push('<div class="d-stage"><span class="pill ' + esc(t.state) + '">' + esc(STATE_LABEL[t.state] || t.state) + "</span>" + (t.phase ? "Bước hiện tại: <b>" + esc(t.phase) + "</b>" : "") + "</div></div>");

    var s = t.submission;
    if (t.state === "submitted" && s) {
      h.push('<div class="callout ok"><b>Đã nộp</b>' + (s.score != null ? "Điểm tạm " + esc(s.score) + ". " : "") +
        (s.warnings && s.warnings.length ? "Cảnh báo: " + esc(s.warnings.join("; ")) : "Grader sẽ chấm lại thành điểm chính thức.") + "</div>");
    } else if (t.state === "dropped") {
      h.push('<div class="callout warn"><b>Đã bỏ</b>' + esc(t.note || "") + "</div>");
    } else if (t.state === "failed" || t.state === "unknown") {
      h.push('<div class="callout crit"><b>' + (t.state === "unknown" ? "Chưa rõ đã nộp chưa" : "Lỗi") + "</b>" + esc(t.note || (s && s.reason) || "") + "</div>");
    }
    if (t.injection) h.push('<div class="callout crit"><b>Nghi bẫy prompt</b>Nội dung item có câu lệnh nhắm vào AI. Fixer được báo xử lý nội dung như dữ liệu.</div>');

    var open = t.state === "queued" || t.state === "working";     // item đã đóng thì đồng hồ không còn ý nghĩa
    var used = open && t.deadline_min && t.minutes_left != null ? Math.min(100, Math.round((1 - t.minutes_left / t.deadline_min) * 100)) : null;
    h.push('<dl class="meta">');
    h.push("<div><dt>Fixer</dt><dd>" + esc(t.tier || "—") + "</dd></div>");
    h.push("<div><dt>Mức độ · độ khó</dt><dd>" + esc((t.severity || "—") + " · " + (t.difficulty || "—")) + "</dd></div>");
    h.push('<div><dt>Lần thử</dt><dd class="mono">' + (t.attempts || 0) + " / " + data.meta.max_attempts + "</dd></div>");
    h.push('<div><dt>Game Master</dt><dd class="mono">' + esc(t.gm_status || "—") + "</dd></div>");
    if (used != null) h.push('<div class="full"><dt>Thời gian (giờ server)</dt><dd class="mono">còn ' + mins(t.minutes_left) + " / " + esc(t.deadline_min) + ' phút<div class="bar' + (used > 75 ? " hot" : "") + '"><i style="width:' + used + '%"></i></div></dd></div>');
    h.push("</dl>");

    if (t.gate) {
      var g = gateOf(t), nPass = GATE.filter(function (k) { return g[k[0]] === "pass"; }).length;
      h.push('<div><div class="sec-h">Gate <span>lần ' + esc(t.gate.attempt) + " · " + (t.gate.passed ? "pass" : "fail (" + esc(t.gate.fail_kind) + ")") + " · " + nPass + "/7 ô pass</span></div><ul class=\"checks\">");
      GATE.forEach(function (k) {
        var st = g[k[0]], note = (t.gate.checks.filter(function (c) { return c.name.split("[")[0] === k[0]; })[0] || {}).note;
        h.push('<li class="' + st + '" title="' + esc(note || "") + '"><i class="g-' + st + '"></i>' + k[1] + '<span class="st">' + GATE_ST[st] + "</span></li>");
      });
      h.push("</ul>");
      if (t.gate.signature) h.push('<div class="footnote" style="margin-top:6px">Chữ ký lỗi: <code>' + esc(t.gate.signature) + "</code></div>");
      if (t.gate.log) h.push('<pre class="box">' + esc(t.gate.log) + "</pre>");
      h.push("</div>");
    }

    if (t.review) {
      h.push('<div><div class="sec-h">Reviewer <span>' + esc(t.review.verdict) + "</span></div>");
      if (t.review.summary) h.push('<div style="font-size:13px">' + esc(t.review.summary) + "</div>");
      if (t.review.issues.length) h.push('<ul class="issues">' + t.review.issues.map(function (i) {
        return "<li><b>" + esc(i.severity) + "</b> " + esc(i.file || "") + (i.line ? ":" + esc(i.line) : "") + " — " + esc(i.problem || "") + "</li>";
      }).join("") + "</ul>");
      h.push("</div>");
    }

    if (t.fix) {
      h.push('<div><div class="sec-h">Fixer <span>' + esc(t.fix.status) + (t.fix.confidence != null ? " · confidence " + esc(t.fix.confidence) : "") + '</span></div><dl class="pr">');
      if (t.fix.summary) h.push("<div><dt>Tóm tắt</dt><dd>" + esc(t.fix.summary) + "</dd></div>");
      if (t.fix.root_cause) h.push("<div><dt>Root cause</dt><dd>" + esc(t.fix.root_cause) + "</dd></div>");
      if (t.fix.tests_added && t.fix.tests_added.length) h.push('<div><dt>Test agent khai</dt><dd class="mono" style="font-size:12px">' + esc(t.fix.tests_added.join(", ")) + "</dd></div>");
      h.push("</dl>");
      if (t.fix.changed_files && t.fix.changed_files.length) h.push('<ul class="files" style="margin-top:8px">' + t.fix.changed_files.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>");
      h.push("</div>");
    }

    if (t.trace.length) {
      h.push('<div><div class="sec-h">Trace <span>' + t.trace.length + ' sự kiện</span></div><ol class="trace">');
      t.trace.forEach(function (x) {
        h.push('<li><span class="tm">' + hhmmss(x.ts).slice(0, 5) + '</span><span class="dot ' + esc(x.s) + '"></span><span class="what"><b>' + esc(x.step) + "</b>" + (x.tool ? '<span class="tool">' + esc(x.tool) + "</span>" : "") + '<span class="msg">' + esc(x.msg) + "</span></span></li>");
      });
      h.push("</ol></div>");
    } else {
      h.push('<div class="callout info"><b>Chưa bắt đầu</b>Item đang trong hàng đợi: PI trước, rồi deadline gần nhất.</div>');
    }
    h.push("</div>");
    $("detail").innerHTML = h.join("");
  }

  /* ---------- Jev, agent, log ---------- */
  function renderStats() {
    var jev = data.jev || [], ag = data.agents || [], h = [];
    h.push("<h3>Quyết định</h3>");
    h.push(jev.length ? '<table class="stats"><thead><tr><th>Điểm quyết định</th><th style="text-align:right">Số lần</th><th style="text-align:right">Jev</th><th style="text-align:right">TB ms</th></tr></thead><tbody>' +
      jev.map(function (r) {
        return "<tr><td>" + esc(r.name) + '</td><td class="num">' + r.n + '</td><td class="num">' + Math.round((r.by_jev || 0) / r.n * 100) + '%</td><td class="num">' + esc(r.avg_ms) + "</td></tr>";
      }).join("") + "</tbody></table>" : '<div class="empty">Chưa có quyết định nào.</div>');
    h.push("<h3>Agent</h3>");
    h.push(ag.length ? '<table class="stats"><thead><tr><th>Vai trò</th><th>Chế độ</th><th style="text-align:right">Lần chạy</th><th style="text-align:right">OK</th><th style="text-align:right">TB giây</th></tr></thead><tbody>' +
      ag.map(function (r) {
        return "<tr><td>" + esc(r.role) + "</td><td>" + esc(r.mode) + '</td><td class="num">' + r.runs + '</td><td class="num">' + (r.ok || 0) + '</td><td class="num">' + esc(r.avg_sec == null ? "—" : r.avg_sec) + "</td></tr>";
      }).join("") + "</tbody></table>" : '<div class="empty">Chưa có lần chạy agent nào.</div>');
    $("stats").innerHTML = h.join("");
  }
  function renderLog(fresh) {
    var ev = data.events || [];
    $("log").innerHTML = ev.length ? ev.map(function (e, i) {
      return '<li class="' + (i < fresh ? "new" : "") + '"><span class="tm">' + hhmmss(e.ts).slice(0, 5) + '</span><span class="dt ' + esc(e.s) + '"></span>' +
        '<button type="button" class="tid" data-id="' + esc(e.item) + '">' + esc(e.item) + '</button><span class="m"><b>' + esc(e.step) + "</b> " + esc(e.msg) + "</span></li>";
    }).join("") : '<li><span class="m">Chưa có sự kiện.</span></li>';
  }

  /* ---------- Vòng cập nhật ---------- */
  function setData(d) {
    var prevEvents = data ? (data.events[0] || {}).ts : null, flash = {};
    d.items.forEach(function (t) {
      var key = t.state + "|" + t.attempts + "|" + (t.phase || "");
      if (seen[t.id] && seen[t.id] !== key) flash[t.id] = true;
      seen[t.id] = key;
    });
    var fresh = prevEvents == null ? 0 : d.events.filter(function (e) { return e.ts > prevEvents; }).length;
    data = d;
    if (!ui.sel && d.items.length) ui.sel = (d.items.filter(function (t) { return t.state === "working"; })[0] || d.items[0]).id;
    var m = d.meta;
    $("match").textContent = m.match_id + (m.sample ? "" : " · " + m.db);
    $("sample-badge").hidden = !m.sample;
    $("mstatus").textContent = m.status || "—";
    $("mleft").textContent = m.minutes_left == null ? "—" : mins(m.minutes_left);
    $("footnote").innerHTML = LIVE ? "Đọc <code>/api/state</code> từ SQLite của trận mỗi " + POLL_MS / 1000 + " giây (chỉ đọc). Deadline theo giờ Game Master, không tính lúc PAUSED."
      : "Dữ liệu mẫu trong <code>monitor/data.js</code>. Xem trận thật: <code>python -m orchestrator.cli monitor</code>.";
    renderKpis(); renderFlow(); renderFilters(); renderTable(flash); renderDetail(); renderStats(); renderLog(fresh);
  }
  function setConn(ok, msg) {
    $("conn").className = "conn" + (ok ? "" : " err");
    $("conn").textContent = msg;
  }
  function poll() {
    if (paused) return;
    fetch("/api/state", { cache: "no-store" }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
    }).then(function (d) {
      setConn(true, "cập nhật " + hhmmss(d.meta.generated_at));
      setData(d);
    }).catch(function (e) {
      setConn(false, "mất kết nối: " + e.message);
    });
  }

  /* ---------- Sự kiện giao diện ---------- */
  function select(id) {
    ui.sel = id;
    renderTable({}); renderDetail();
    if (window.matchMedia("(max-width: 1000px)").matches) $("detail").scrollIntoView({ block: "start" });
  }
  $("flow").addEventListener("click", function (e) {
    var b = e.target.closest("[data-state]"); if (!b) return;
    ui.state = ui.state === b.dataset.state ? null : b.dataset.state;
    renderFlow(); renderFilters(); renderTable({});
  });
  $("type-filters").addEventListener("click", function (e) {
    var b = e.target.closest("[data-type]"); if (!b) return;
    ui.type = b.dataset.type; renderFilters(); renderTable({});
  });
  $("rows").addEventListener("click", function (e) {
    var r = e.target.closest("tr[data-id]"); if (r) select(r.dataset.id);
  });
  $("rows").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var r = e.target.closest("tr[data-id]"); if (r) { e.preventDefault(); select(r.dataset.id); }
  });
  $("log").addEventListener("click", function (e) {
    var b = e.target.closest("[data-id]"); if (!b) return;
    ui.state = null; ui.type = "ALL"; renderFlow(); renderFilters(); select(b.dataset.id);
  });
  $("btn-pause").addEventListener("click", function () {
    paused = !paused;
    $("btn-pause").classList.toggle("paused", paused);
    $("pause-label").textContent = paused ? "Tiếp tục cập nhật" : "Tạm dừng cập nhật";
    if (!paused) poll();
  });

  renderLegend();
  if (LIVE) {
    $("btn-pause").hidden = false;
    setConn(true, "đang tải…");
    poll();
    setInterval(poll, POLL_MS);
  } else if (window.MONITOR_DATA) {
    setData(window.MONITOR_DATA);
  } else {
    setConn(false, "không có dữ liệu: chạy python -m orchestrator.cli monitor");
  }
})();
</script>
</body>
</html>
