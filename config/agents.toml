# Cấu hình từng vai trò agent. Orchestrator đọc file này để dựng lệnh `codex exec`.
#
# model = ""          → để Codex dùng model mặc định. Chốt model sau khi đo ở practice:
#                       vai trò đọc/tóm tắt dùng model rẻ, fixer dùng model mạnh.
# effort              → model_reasoning_effort: "low" | "medium" | "high"
# sandbox             → "read-only" | "workspace-write"
# timeout_sec         → quá giờ thì orchestrator dừng tiến trình codex
# add_dirs            → thư mục ngoài worktree Codex được ghi (vd. cache Maven ~/.m2)
# codex_home = ""     → không đặt CODEX_HOME: Codex dùng môi trường chuẩn của BTC (login, MCP tool
#                       đi kèm source). Muốn dùng cấu hình riêng thì đặt "config/codex-home".

[defaults]
codex_bin = "codex"
codex_home = ""
model = ""
effort = "medium"
timeout_sec = 900
add_dirs = []

# Tier model + effort cho fixer. Jev chọn "small" hay "strong" cho từng item (Decider.route),
# AgentRunner.run(..., tier=...) đổi nhãn thành cặp dưới đây. Tier thắng [roles.*] và by_type.
# Danh sách model có trên máy: ~/.codex/models_cache.json. Kiểm lại model thi dùng được ở Training Camp.
[tiers.small]
model = "gpt-6-luna"
effort = "low"

[tiers.strong]
model = "gpt-6-luna"
effort = "high"

[roles.fixer]
role = "fixer"
schema = "fix-result"
sandbox = "workspace-write"
model = ""            # model mạnh
effort = "medium"
timeout_sec = 1200
add_dirs = ["~/.m2"]  # Maven cần ghi vào cache cục bộ; kiểm lại khi chạy thật

[roles.fixer.by_type]  # ghi đè theo loại item
PI = { effort = "medium", timeout_sec = 900 }
TASK = { effort = "low" }

[roles.reviewer]
role = "reviewer"
schema = "review"
sandbox = "read-only"
model = ""            # model rẻ hoặc trung bình
effort = "low"
timeout_sec = 300

[roles.pi_hypothesis]
role = "pi-hypothesis"
schema = "hypothesis"
sandbox = "read-only"
model = ""
effort = "low"
timeout_sec = 300
