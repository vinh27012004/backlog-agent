# Vòng run (orchestrator/match.py): chạy song song, số lần thử, ngưỡng rút gọn khi sắp hết giờ.
# Thời gian tính theo phút còn lại của item, lấy từ đồng hồ Game Master.

max_attempts = 3          # số lần fixer tối đa cho một item
workers = 2               # số item xử lý song song (0 = tuần tự trong thread chính, để debug)
poll_sec = 5              # bao lâu hỏi Game Master một lần
review_min_left = 8       # còn ít hơn số phút này thì bỏ reviewer
regression_min_left = 4   # còn ít hơn thì bỏ test_all (không bao giờ bỏ build và test của agent)
pi_hypotheses = 2         # PI fail gate: số giả thuyết kiểm song song trước lần thử sau
submit_retries = 5        # nộp gặp MATCH_NOT_RUNNING / lỗi mạng: chờ rồi thử lại tối đa bấy nhiêu lần
